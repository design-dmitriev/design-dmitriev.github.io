name: Refresh Telegram blog
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: telegram-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public blog feed
        continue-on-error: true
        run: node scripts/update-telegram.cjs
      - name: Save refreshed feed
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add index.html data/telegram.json assets/blog
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Telegram blog feed"
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='scripts' --exclude='PORTFOLIO-HANDOFF.txt' --exclude='.gitignore' ./ _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
