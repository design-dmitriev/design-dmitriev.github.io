<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заглавка: сборка по правилам</title>
<style>
@font-face{font-family:InterKit;font-weight:500;src:url(fonts/inter-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:InterKit;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:InterKit;font-weight:600;src:url(fonts/inter-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:InterKit;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:InterKit;font-weight:700;src:url(fonts/inter-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:InterKit;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#f1f1f1}
body{display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",InterKit,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#fit{position:relative;width:900px;height:1500px;transform-origin:center;flex:none}
#s{position:absolute;left:0;top:60px;box-shadow:0 30px 70px -30px rgba(0,0,0,.35);width:900px;height:1200px;background:#fff;color:#0b0b0b;overflow:hidden;--g1:#4db8ff;--g2:#0a7aff;--g3:#5e5ce6;border-radius:0}
.br{position:absolute;width:74px;height:74px;border:4px solid #000;opacity:0;transition:opacity .36s,transform .48s cubic-bezier(.2,.7,.2,1)}
.br.a{left:26px;top:26px;border-right:0;border-bottom:0;border-radius:48px 0 0 0;transform:translate(24px,24px)}
.br.b{right:26px;top:26px;border-left:0;border-bottom:0;border-radius:0 48px 0 0;transform:translate(-24px,24px)}
.br.c{left:26px;bottom:26px;border-right:0;border-top:0;border-radius:0 0 0 48px;transform:translate(24px,-24px)}
.br.d{right:26px;bottom:26px;border-left:0;border-top:0;border-radius:0 0 48px 0;transform:translate(-24px,-24px)}
.st1 .br{opacity:1;transform:none}
#logo{position:absolute;left:339px;top:26px;width:222px;height:66px;border:3px dashed #9a9a9a;border-radius:16px;display:grid;place-items:center;font-weight:500;font-size:26px;color:#8a8a8a;opacity:0;transform:translateY(-14px);transition:all .36s .15s cubic-bezier(.2,.7,.2,1)}
.st1 #logo{opacity:1;transform:none}
#head{position:absolute;left:67px;top:148px;width:766px;opacity:0;transform:translateY(18px);transition:all .42s cubic-bezier(.2,.7,.2,1)}
.st2 #head{opacity:1;transform:none}
#ttl{font-weight:600;font-size:90px;line-height:80px;letter-spacing:-.02em}
#sub{margin-top:14px;font-weight:500;font-size:64px;line-height:64px;letter-spacing:-.01em;color:#383837}
#guard{position:absolute;left:67px;top:380px;width:766px;border-top:3px dashed #ff4f7b;opacity:0;transition:opacity .24s}
#guard i{position:absolute;right:0;top:6px;font-weight:500;font-size:24px;font-family:inherit;color:#ff4f7b;font-style:normal}
.st2.gd #guard{opacity:1}
.of{position:absolute;left:67px;width:340px;height:76px;display:flex;align-items:center;gap:16px;opacity:0;transform:translateX(-40px);transition:opacity .3s,transform .42s cubic-bezier(.2,.7,.2,1)}
.o1{top:428px}.o2{top:570px}.o3{top:712px}
.st3 .of{opacity:1;transform:none}.st3 .o2{transition-delay:.12s}.st3 .o3{transition-delay:.24s}
.of svg{width:60px;height:60px;flex:none;fill:none;stroke:#0b0b0b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.of b{display:block;font-weight:700;font-size:56px;line-height:44px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent;transition:opacity .15s}
.of span{display:block;margin-top:8px;font-weight:700;font-size:32px;line-height:24px;letter-spacing:-.02em;transition:opacity .15s}
.sw b,.sw span,.sw svg{opacity:0}
#zone{position:absolute;left:379px;top:428px;width:454px;height:552px;border:3px dashed #b8b8b8;border-radius:32px;opacity:0;transform:scale(.96);transition:all .42s cubic-bezier(.2,.7,.2,1);display:grid;place-items:center}
.st4 #zone{opacity:1;transform:none}
#prod{width:250px;height:370px;border-radius:44px;background:linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3));opacity:.92;box-shadow:0 40px 60px -30px rgba(0,0,0,.35);transform:translateY(30px) scale(.9);transition:transform .54s .12s cubic-bezier(.2,.7,.2,1),background .24s}
.st4 #prod{transform:none}
#prod::after{content:"товар";position:absolute;inset:auto 0 18px 0;text-align:center;color:rgba(255,255,255,.85);font-weight:500;font-size:28px;font-family:inherit}
#pct{position:absolute;right:26px;top:994px;font-weight:700;font-size:40px;font-family:inherit;color:#8a8a8a;opacity:0;transition:opacity .3s .3s}
.st4 #pct{opacity:1}
#cat{position:absolute;left:67px;top:1010px;display:flex;gap:10px;opacity:0;transition:opacity .24s}
.st5 #cat{opacity:1}
#cat i{font-style:normal;font-weight:500;font-size:26px;padding:8px 20px;border-radius:99px;background:#eee;color:#6b6b6b;transition:all .18s}
#cat i.on{background:#0b0b0b;color:#fff}
#cap{position:absolute;left:50%;top:1300px;width:max-content;max-width:860px;text-align:center;transform:translateX(-50%);background:#0b0b0b;color:#fff;border-radius:50px;padding:18px 40px;line-height:1.2;font-weight:500;font-size:36px;font-family:inherit;transition:opacity .3s}
#note{position:absolute;left:0;right:0;top:1440px;text-align:center;font-weight:500;font-size:26px;font-family:inherit;color:#9a9a9a}
@media (prefers-reduced-motion:reduce){#s *{transition-duration:.01s!important}}
</style><meta name="robots" content="noimageindex"><script src="../assets/guard.js?v=1"></script></head>
<body>
<div id="fit"><div id="s">
  <i class="br a"></i><i class="br b"></i><i class="br c"></i><i class="br d"></i>
  <div id="logo">ЛОГОТИП</div>
  <div id="head"><div id="ttl">Кабель Type-C</div><div id="sub">передача данных</div></div>
  <div id="guard"><i>охранная зона 56</i></div>
  <div class="of o1"><svg viewBox="0 0 60 60"></svg><div><b></b><span></span></div></div>
  <div class="of o2"><svg viewBox="0 0 60 60"></svg><div><b></b><span></span></div></div>
  <div class="of o3"><svg viewBox="0 0 60 60"></svg><div><b></b><span></span></div></div>
  <div id="zone"><div id="prod"></div></div>
  <div id="pct">70%</div>
  <div id="cat"><i>Кабели</i><i>Питание</i><i>Звук</i><i>Общие</i></div>
</div>
  <div id="cap"></div>
  <div id="note">цифры в примере условные</div>
</div>
<script>
(function(){
  var s=document.getElementById('s'),fit=document.getElementById('fit'),cap=document.getElementById('cap');
  function sc(){var k=Math.min(innerWidth/900,innerHeight/1500);fit.style.transform='scale('+k+')';fit.style.margin=((1500*k-1500)/2)+'px '+((900*k-900)/2)+'px'}
  addEventListener('resize',sc);sc();
  var IC={
    ruler:'<rect x="6" y="22" width="48" height="16" rx="3"/><path d="M16 22v7M26 22v10M36 22v7M46 22v10"/>',
    bolt:'<path d="M34 6 14 34h14l-4 20 22-30H32z"/>',
    plug:'<rect x="18" y="8" width="24" height="26" rx="5"/><path d="M24 8V2M36 8V2M30 34v14M22 54h16"/>',
    mic:'<rect x="22" y="6" width="16" height="28" rx="8"/><path d="M14 28a16 16 0 0 0 32 0M30 44v10M22 54h16"/>',
    sound:'<path d="M10 24h10l14-12v36L20 36H10z"/><path d="M42 22a12 12 0 0 1 0 16M48 14a22 22 0 0 1 0 32"/>',
    shield:'<path d="M30 6 10 14v16c0 12 8 20 20 24 12-4 20-12 20-24V14z"/><path d="m21 30 7 7 12-14"/>',
    batt:'<rect x="8" y="16" width="40" height="28" rx="6"/><path d="M52 26v8M16 24v12M24 24v12"/>',
    port:'<rect x="10" y="20" width="40" height="20" rx="10"/><path d="M22 30h16"/>',
    time:'<circle cx="30" cy="30" r="22"/><path d="M30 16v15l10 6"/>'
  };
  var CAT=[
    {n:0,t:'Кабель Type-C',u:'передача данных',g:['#4db8ff','#0a7aff','#5e5ce6'],o:[['1 м','длина','ruler'],['100%','оригинал','shield'],['USB-C','разъём','plug']]},
    {n:1,t:'Блок питания',u:'заряд за 35 минут',g:['#ff9f45','#ff6b1a','#e5390f'],o:[['35 Вт','мощность','bolt'],['100%','за 35 минут','batt'],['2','порта','port']]},
    {n:2,t:'Наушники',u:'чистый звук в дороге',g:['#ff9500','#ff2d55','#af52de'],o:[['HD','микрофон','mic'],['30 ч','работы','time'],['тихо','без шума','sound']]},
    {n:3,t:'Гарантия на всё',u:'общие офферы',g:['#472483','#a3338f','#ff4f7b'],o:[['12 мес','гарантия','shield'],['100%','оригинал','batt'],['14 дн','возврат','time']]}
  ];
  var ofs=[].slice.call(s.querySelectorAll('.of')),chips=[].slice.call(s.querySelectorAll('#cat i'));
  function setCat(c,quick){
    s.style.setProperty('--g1',c.g[0]);s.style.setProperty('--g2',c.g[1]);s.style.setProperty('--g3',c.g[2]);
    var apply=function(){
      document.getElementById('ttl').textContent=c.t;document.getElementById('sub').textContent=c.u;
      ofs.forEach(function(el,i){var o=c.o[i];el.querySelector('b').textContent=o[0];el.querySelector('span').textContent=o[1];el.querySelector('svg').innerHTML=IC[o[2]]});
      chips.forEach(function(x,i){x.classList.toggle('on',i===c.n)});
      s.classList.remove('sw');
    };
    if(quick){apply();return}
    s.classList.add('sw');setTimeout(apply,160);
  }
  var STEPS=[
    ['Рамка и логотип на одном месте',1],
    ['Заголовок: одна мысль, до двух строк',2],
    ['До трёх офферов, только слева',3],
    ['Товар занимает около 70% слайда',4],
    ['Градиент зависит от категории товара',5]
  ];
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function show(text){cap.style.opacity=0;setTimeout(function(){cap.textContent=text;cap.style.opacity=1},200)}
  function cls(n){for(var i=1;i<=5;i++)s.classList.toggle('st'+i,i<=n)}
  var t=[];function at(ms,f){t.push(setTimeout(f,ms))}
  function rep(i,d){try{parent.postMessage({fy:'step',i:i,n:STEPS.length,d:d},'*')}catch(e){}}
  function run(from){
    from=from||0;t.forEach(clearTimeout);t=[];
    var T=reduce?400:1800,C=reduce?500:1080,K=reduce?400:900,H=reduce?300:800,o=from?0:300,last=STEPS.length-1;
    cls(from?STEPS[from-1][1]:0);s.classList.remove('gd');setCat(CAT[0],true);
    if(!from){cap.textContent='';cap.style.opacity=0}
    for(var i=from;i<STEPS.length;i++)(function(i,st){at(o+(i-from)*T,function(){cls(st[1]);show(st[0]);rep(i,i===last?K+C+H:T);if(i===1)at(850,function(){s.classList.add('gd')});if(i===2)s.classList.remove('gd')})})(i,STEPS[i]);
    var b=o+(last-from)*T;
    at(b+K,function(){setCat(CAT[1])});
    at(b+K+C,function(){setCat(CAT[2])});
    at(b+K+C+H,function(){run(0)});
  }
  try{parent.postMessage({fy:'steps',n:STEPS.length},'*')}catch(e){}
  addEventListener('message',function(e){var m=e.data;if(m&&m.fy==='go'&&m.i>=0&&m.i<STEPS.length)run(m.i)});
  document.fonts.ready.then(function(){run(0)});
})();
</script>
</body></html>
