<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>Карточка товара — Алексей Дмитриев</title>
<link rel="preload" href="../assets/fonts/zarya-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="card.css?v=4">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
<header class="bar">
  <a class="back" href="../#zaglavki">← Портфолио</a>
  <span class="who">Алексей Дмитриев</span>
</header>

<main class="deck" id="deck">
  <section class="stage-col">
    <div class="frame">
    <div class="ticks" id="ticks" aria-hidden="true"></div>
    <div class="stage" id="stage" aria-live="off">
      <div class="intro" id="intro">
        <p class="eyebrow">Карточка товара</p>
        <h1>Быстрая зарядка для iPhone</h1>
        <p class="lead">Блок и кабель. Девять слайдов: от заглавной до инфографики.</p>
        <button class="go" id="start" type="button">Смотреть <span aria-hidden="true">→</span></button>
      </div>
      <div class="slides" id="slides"></div>
      <div class="outro" id="outro" hidden>
        <p class="eyebrow">Все слайды</p>
        <div class="grid" id="grid"></div>
        <button class="go" id="again" type="button">Смотреть заново <span aria-hidden="true">↻</span></button>
      </div>
    </div>
    </div>
    <div class="ctrl">
      <button id="pv" type="button" class="ar" aria-label="Назад">←</button>
      <button id="pp" type="button" aria-label="Пауза">Пауза</button>
      <button id="nx" type="button" class="ar" aria-label="Вперёд">→</button>
      <span class="tag" id="tag" hidden></span>
    </div>
  </section>
  <aside class="side">
    <h2>Что на каждом слайде</h2>
    <ol class="list" id="list"></ol>
  </aside>
</main>
<script src="card.js?v=3"></script>
</body>
</html>
